<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>E-Commerce Product Catalog</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Header -->

    <header>

        <h1>My Store</h1>

        <nav>

            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#contact">Contact</a>

        </nav>

    </header>

    <!-- Hero -->

    <section class="hero" id="home">

        <h2>Welcome to My Store</h2>

        <p>
            Explore amazing products with
            responsive design.
        </p>

    </section>

    <!-- Products -->

    <section
        class="products"
        id="products">

        <div class="product-card">

            <img
src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"
                alt="Shoes">

            <h3>Running Shoes</h3>

            <p>$99</p>

            <button>Add to Cart</button>

        </div>

        <div class="product-card">

            <img
src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"
                alt="Watch">

            <h3>Smart Watch</h3>

            <p>$149</p>

            <button>Add to Cart</button>

        </div>

        <div class="product-card">

            <img
src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400"
                alt="Phone">

            <h3>Mobile Phone</h3>

            <p>$499</p>

            <button>Add to Cart</button>

        </div>

    </section>

    <!-- Contact -->

    <section
        class="contact"
        id="contact">

        <h2>Contact Us</h2>

        <form>

            <input
                type="text"
                placeholder="Your Name">

            <input
                type="email"
                placeholder="Your Email">

            <textarea
                placeholder="Message">
            </textarea>

            <button type="submit">
                Send
            </button>

        </form>

    </section>

    <!-- Footer -->

    <footer>

        <p>
            © 2026 My Store
        </p>

    </footer>

</body>

</html>
